version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: all
  disable:
    - copyloopvar
    - depguard
    - exhaustruct
    - rowserrcheck
    - sqlclosecheck
    - tagalign
    - varnamelen
    - wastedassign
    - wsl
    - wsl_v5
    - noinlineerr
    - gosec
  settings:
    cyclop:
      max-complexity: 12
      package-average: 0
    dupl:
      threshold: 200
    errcheck:
      check-type-assertions: false
      check-blank: false
    funlen:
      lines: 70
      statements: 40
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - paramTypeCombine
      enabled-tags:
        - performance
        - style
        - experimental
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - BUG
        - FIXME
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: true
    lll:
      line-length: 120
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
        use-field-name: true
    unparam:
      check-exported: false
    whitespace:
      multi-if: false
      multi-func: false
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - telnet.DialInteractive(
        - Close()
      ignore-package-globs:
        - encoding/*
        - github.com/pkg/*
    wsl:
      strict-append: true
      allow-assign-and-call: true
      allow-multiline-assign: true
      force-case-trailing-whitespace: 0
      allow-trailing-comment: true
      allow-cuddle-declarations: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: ^//\s*go:generate\s
      - linters:
          - godot
        source: (noinspection|TODO)
      - linters:
          - gocritic
        source: //noinspection
      - linters:
          - bodyclose
          - dupl
          - errcheck
          - funlen
          - goconst
          - gosec
          - noctx
          - staticcheck
          - wrapcheck
        path: _test\.go
      - path: (.+)\.go$
        text: Version`? is a global variable
      - path: (.+)\.go$
        text: cognitive complexity \d+ of func `Interactive` is high
      - path: (.+)\.go$
        text: are|is missing in
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - .*_test.go$
      - vendor/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/golangci/golangci-lint
  exclusions:
    generated: lax
    paths:
      - .*_test.go$
      - vendor/
      - third_party$
      - builtin$
      - examples$
